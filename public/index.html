<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Faculdade IDE</title>
<meta name="description" content="Acompanhamento de admissões: investimento em mídia, funil do Rubeus, conversões enviadas ao Google Ads e conversas de WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <!--
          Marca quadrada só aparece com a sidebar retraída (72px): a assinatura
          horizontal ficaria com ~18px de altura ali e deixaria de ser legível.
        -->
        <div class="logo-mark" aria-hidden="true">IDE</div>
        <img class="logo-img" src="/logo-IDE-faculdade-dark.svg"
             alt="Faculdade IDE" width="106" height="40">
      </div>
      <button class="btn-retrair" id="btn-retrair" aria-expanded="true" aria-controls="nav"
              title="Retrair menu" aria-label="Retrair menu">«</button>
    </div>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
  </aside>

  <main class="main">

    <div class="topbar">
      <div class="search desktop-only" aria-hidden="true">
        <span>Buscar lead, curso, processo…</span><span class="kbd">⌘K</span>
      </div>
      <div class="topbar-title mobile-only" id="mobile-title">Painel IDE</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-refresh" title="Atualizar dados" aria-label="Atualizar dados">↻</button>
        <div class="user-block">
          <div class="avatar" id="user-avatar">—</div>
          <div class="desktop-only">
            <div class="user-name" id="user-name">Carregando…</div>
            <div class="user-role">Faculdade IDE</div>
          </div>
        </div>
      </div>
    </div>

    <div id="page" aria-live="polite"></div>

  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>

<script src="/app.js"></script>
</body>
</html>
